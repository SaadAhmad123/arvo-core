# Traces, kept long enough that a run can be queried after it finishes.

server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # short, so a test that has just finished a run can query it rather
  # than waiting for a flush that is tuned for production volumes
  max_block_duration: 5m
  complete_block_timeout: 10s

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
