# Metrics, from the collector and from Temporal itself, so the
# framework's view of a run sits beside Arvo's own.

global:
  scrape_interval: 2s
  evaluation_interval: 15s

scrape_configs:
  # Arvo's own four, and anything the SDK publishes, by way of the
  # collector's Prometheus exporter.
  - job_name: arvo-handlers
    static_configs:
      - targets: ['otel-collector:8889']

  # the collector's own health, because a pipeline that drops signals
  # must not do so silently
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  # Temporal's own view of the same executions
  - job_name: temporal
    static_configs:
      - targets: ['temporal:8000']
