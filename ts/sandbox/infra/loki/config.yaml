# Logs, with OTLP ingestion on, so a line an executor wrote keeps the
# trace and span it was written under.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 24h
  # a wide run writes a great many lines in a very short window
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64

ruler:
  alertmanager_url: http://localhost:9093
